<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>组件库演练场</title>
    <style>
      #app {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <fieldset>
        <legend>switch 组件</legend>
        <div class="layout">
          <div>
            <span>大号</span>
            <e-switch
              id="large"
              size="large"></e-switch>
          </div>
          <div>
            <span>默认</span>
            <e-switch id="default"></e-switch>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>进度条</legend>
        <span style="font-weight: 700;">普通进度条</span>
        <div class="layout">
          <div>
            <e-progress
              value="18"
              color="#ffe4e1"></e-progress>
          </div>
          <div>
            <e-progress
              value="88"
              color="rgb(169, 157, 249)"
              ani></e-progress>
          </div>
        </div>
        <span style="font-weight: 700;">环形进度条</span>
        <div class="layout">
          <div>
            <e-progress
              type="circle"
              color="#cdb9df"
              value="84"></e-progress>
          </div>
          <div>
            <e-progress
              type="circle"
              value="99"
              color="#0078d4"
              ani></e-progress>
          </div>
        </div>
      </fieldset>
    </div>
  </body>
</html>
